<!-- views/maps.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Weather Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UrbanAir Weather Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css">
    <link rel="stylesheet" href="/css/theme.css">

</head>
<body>


<div class="container-fluid">
    <div class="row gx-0">
        <!-- Sidebar (fixed width) -->
        <div class="col-auto">
            <nav class="sidebar">
                <h1 class="logo">UrbanAir</h1>
                <ul class="nav flex-column">
                    <li class="nav-item"><a href="/" class="nav-link">Dashboard</a></li>
                    <li class="nav-item"><a href="/locations" class="nav-link">Locations</a></li>
                    <li class="nav-item"><a href="/maps" class="nav-link">Maps</a></li>
                    <li class="nav-item"><a href="/reports" class="nav-link">Reports</a></li>
                    <li class="nav-item"><a href="/settings" class="nav-link">Settings</a></li>
                </ul>
                <footer class="mt-auto">WeatherHub ©2025</footer>
            </nav>
        </div>


        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 px-4">

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center py-3">
                <input type="text" class="form-control w-25" placeholder="Search here...">
                <div class="d-flex gap-3">
                    <span>⭐ 38</span>
                    <span id="alertsIcon">🔔 12</span>
                    <!-- Alerts Dropdown Container -->
                    <div id="alertsDropdown" class="alerts-dropdown"></div>
                    <span id="calendarIcon">📅</span>
                    <input type="text" id="calendarInput" style="display:none;">
                    <div id="weatherDateContainer"></div>
                </div>
            </div>

            <!-- Weather Info -->
            <div class="card p-4 shadow-sm">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <div id="geolocation"></div>
                        <div id="location"></div>
                    </div>
                    <div class="col-md-6 text-center">
                        <span id="mainIcon" class="display-1">🌤️</span>
                    </div>
                </div>
            </div>

            <!-- Weather Details -->
            <div class="row mt-3">
                <div class="col-md-4">
                    <div class="card p-3 text-center">
                        <h5>Humidity</h5>
                        <p id="rain"></p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 text-center">
                        <h5>UV Index</h5>
                        <p id="uv"></p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 text-center">
                        <h5>Wind</h5>
                        <p id="windFactor"></p>
                    </div>
                </div>
            </div>

            <!-- Forecast -->
            <div class="row mt-3">
                <div class="col-md-6">
                    <div class="card p-3">
                        <h5>Today / Week</h5>
                        <!-- Daily Forecast Section -->
                        <h3 class="mt-4">7-Day Forecast</h3>
                        <div class="row" id="dailyForecast"></div>

                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card p-3">
                        <h5>Sunrise & Sunset</h5>
                        <p id="sunrise">🌅 Sunrise: 6:45 AM</p>
                        <p id="sunset">🌇 Sunset: 5:30 PM</p>
                        <p id="length">⏳ Length of Day: 10h 23m</p>
                    </div>
                </div>
            </div>

            <!-- Other Cities -
            <h3 class="mt-4">Other Cities</h3>
            <div class="row" id="weatherContainer">
            </div>-->
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<!-- Existing body content -->
<script src="https://unpkg.com/@popperjs/core@2"></script>
<script src="https://unpkg.com/tippy.js@6"></script>

<script type="module" src="../scripts/common/geolocation.js"></script>

<!-- Load common script for general JS functions -->
<script type="module" src="../scripts/common/main.js"></script>

<!-- Load icon-related JS file (UI assets) -->
<script type="module" src="../scripts/uiAssets/icons.js"></script>

<!-- Load client-side functionality (fetch data and update UI) -->
<script type="module" src="../scripts/weather/fetch.js"></script>

<!-- Load additional client-side UI JS if necessary -->
<script type="module" src="../scripts/weather/ui.js"></script>
</body>
</html>
