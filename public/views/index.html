<!-- views/maps.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Weather Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UrbanAir Weather Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css">

<style>
    /* Sidebar Styling */
    .sidebar {
        height: 100vh;
        position: fixed;
        width: 250px;
        padding-top: 20px;
        border-right: 1px solid #ddd;
    }

    .sidebar .nav-link {
        font-size: 18px;
        padding: 10px 15px;
        color: #333;
    }

    .sidebar .nav-link:hover {
        background-color: #3498db;
        color: white;
        border-radius: 5px;
    }

    .sidebar footer {
        position: absolute;
        bottom: 10px;
        width: 100%;
    }

    /* Main Content */
    main {
        margin-left: 250px;
        padding: 20px;
    }

    /* Card Styling */
    .card {
        border-radius: 10px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
    }

    /* nav icons*/
    /* Alerts Dropdown Styling */
    .alerts-dropdown {
        position: absolute;
        top: 75px;
        right: 0;
        width: 250px;
        background: white;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        border-radius: 5px;
        display: none;
        z-index: 1000;
        padding: 10px;
    }

    .alerts-dropdown h6 {
        margin-bottom: 10px;
        font-weight: bold;
        text-align: center;
    }

    .alerts-dropdown p {
        font-size: 14px;
        margin: 5px 0;
        padding: 5px;
        border-bottom: 1px solid #ddd;
    }

    .alerts-dropdown p:last-child {
        border-bottom: none;
    }

</style>
</head>
<body>
<h1>Welcome to the Weather App</h1>
<div id="weather">
    <p>Loading weather data...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<!-- Existing body content -->
<script src="https://unpkg.com/@popperjs/core@2"></script>
<script src="https://unpkg.com/tippy.js@6"></script>

<script type="module" src="../scripts/common/geolocation.js"></script>

<!-- Load common script for general JS functions -->
<script type="module" src="../scripts/common/main.js"></script>

<!-- Load icon-related JS file (UI assets) -->
<script type="module" src="../scripts/uiAssets/icons.js"></script>

<!-- Load client-side functionality (fetch data and update UI) -->
<script type="module" src="../scripts/weather/fetch.js"></script>

<!-- Load additional client-side UI JS if necessary -->
<script type="module" src="../scripts/weather/ui.js"></script>
</body>
</html>
