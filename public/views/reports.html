<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Locations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        /* Sidebar Styling */
        .sidebar {
            height: 100vh;
            position: fixed;
            width: 250px;
            padding-top: 20px;
            border-right: 1px solid #ddd;
        }

        .sidebar .nav-link {
            font-size: 18px;
            padding: 10px 15px;
            color: #333;
        }

        .sidebar .nav-link:hover {
            background-color: #3498db;
            color: white;
            border-radius: 5px;
        }

        .sidebar footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
        }

        /* Main Content */
        main {
            margin-left: 250px;
            padding: 20px;
        }

        /* Card Styling */
        .card {
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }

        /* nav icons*/
        /* Alerts Dropdown Styling */
        .alerts-dropdown {
            position: absolute;
            top: 75px;
            right: 0;
            width: 250px;
            background: white;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            display: none;
            z-index: 1000;
            padding: 10px;
        }

        .alerts-dropdown h6 {
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
        }

        .alerts-dropdown p {
            font-size: 14px;
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid #ddd;
        }

        .alerts-dropdown p:last-child {
            border-bottom: none;
        }

    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar">
            <h1 class="logo text-primary text-center py-3">UrbanAir</h1>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/index" class="nav-link">Dashboard</a></li>
                <li class="nav-item"><a href="/locations" class="nav-link">Locations</a></li>
                <li class="nav-item"><a href="/maps" class="nav-link">Maps</a></li>
                <li class="nav-item"><a href="/reports" class="nav-link">Reports</a></li>
                <li class="nav-item"><a href="/settings" class="nav-link">Settings</a></li>
            </ul>
            <footer class="text-muted text-center py-3">UrbanAir ©2025</footer>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 px-4">
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Leaflet.js JS -->
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>

</script>

</body>
</html>
